name: build-windows

on:
  workflow_dispatch:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build receiver and posture driver
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -Configuration Release -Runtime win-x64 -OutputPath (Join-Path $env:RUNNER_TEMP 'SurfaceModeReceiver-publish') -DriverOutputPath (Join-Path $env:RUNNER_TEMP 'SurfacePostureDriver')

      - name: Package receiver
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'SurfaceModeReceiver.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $env:RUNNER_TEMP 'SurfaceModeReceiver-publish\*') -DestinationPath $zip
          "RECEIVER_ARTIFACT=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package posture driver
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'SurfacePostureDriver.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $env:RUNNER_TEMP 'SurfacePostureDriver\package\*') -DestinationPath $zip
          "DRIVER_ARTIFACT=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurfaceModeReceiver.zip
          path: ${{ env.RECEIVER_ARTIFACT }}
          if-no-files-found: error

      - name: Upload posture driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurfacePostureDriver.zip
          path: ${{ env.DRIVER_ARTIFACT }}
          if-no-files-found: error
