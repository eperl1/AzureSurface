name: build-ios-unsigned

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios-unsigned.yml"

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone FreeRDP
        run: git clone --depth 1 --branch 3.30.0 https://github.com/FreeRDP/FreeRDP.git freerdp-upstream

      - name: Apply SurfaceMode overlay
        run: bash ios/scripts/apply-freerdp-overlay.sh "$GITHUB_WORKSPACE/freerdp-upstream"

      - name: Force SurfaceMode settings integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ios = Path("freerdp-upstream/client/iOS")
          header = ios / "SurfaceMode/AppSettingsController+SurfaceMode.h"
          impl = ios / "SurfaceMode/AppSettingsController+SurfaceMode.m"
          scene = ios / "SceneDelegate.m"

          h = header.read_text(encoding="utf-8")
          if "+ (void)installSurfaceModeIntegration;" not in h:
              h = h.replace(
                  "@interface AppSettingsController (SurfaceMode)\n",
                  "@interface AppSettingsController (SurfaceMode)\n\n+ (void)installSurfaceModeIntegration;\n",
                  1,
              )
              header.write_text(h, encoding="utf-8")

          m = impl.read_text(encoding="utf-8")
          start = m.find("+ (void)load\n{")
          end = m.find("\n+ (void)swizzleSelector:", start)
          if "+ (void)installSurfaceModeIntegration" not in m:
              if start < 0 or end < 0:
                  raise SystemExit("Could not find SurfaceMode +load block")
              replacement = (
                  "static dispatch_once_t SurfaceModeInstallOnce;\n\n"
                  "+ (void)load\n"
                  "{\n"
                  "    [self installSurfaceModeIntegration];\n"
                  "}\n\n"
                  "+ (void)installSurfaceModeIntegration\n"
                  "{\n"
                  "    dispatch_once(&SurfaceModeInstallOnce, ^{\n"
                  "        [self swizzleSelector:@selector(viewDidLoad) with:@selector(sm_viewDidLoad)];\n"
                  "        [self swizzleSelector:@selector(dealloc) with:@selector(sm_dealloc)];\n"
                  "        [self swizzleSelector:@selector(numberOfSectionsInTableView:) with:@selector(sm_numberOfSectionsInTableView:)];\n"
                  "        [self swizzleSelector:@selector(tableView:numberOfRowsInSection:) with:@selector(sm_tableView:numberOfRowsInSection:)];\n"
                  "        [self swizzleSelector:@selector(tableView:titleForHeaderInSection:) with:@selector(sm_tableView:titleForHeaderInSection:)];\n"
                  "        [self swizzleSelector:@selector(tableView:cellForRowAtIndexPath:) with:@selector(sm_tableView:cellForRowAtIndexPath:)];\n"
                  "        [self swizzleSelector:@selector(tableView:didSelectRowAtIndexPath:) with:@selector(sm_tableView:didSelectRowAtIndexPath:)];\n"
                  "    });\n"
                  "}\n"
              )
              m = m[:start] + replacement + m[end:]
              impl.write_text(m, encoding="utf-8")

          s = scene.read_text(encoding="utf-8")
          import_marker = '#import "AppSettingsController.h"\n'
          import_line = '#import "SurfaceMode/AppSettingsController+SurfaceMode.h"\n'
          if import_line not in s:
              if import_marker not in s:
                  raise SystemExit("Could not find SceneDelegate import point")
              s = s.replace(import_marker, import_marker + import_line, 1)

          create_marker = "\t// create app settings view and navigation controller\n\tAppSettingsController *appSettingsController =\n"
          create_replacement = (
              "\t// Force SurfaceMode hooks before the Settings controller is created.\n"
              "\t[AppSettingsController installSurfaceModeIntegration];\n\n"
              + create_marker
          )
          if "[AppSettingsController installSurfaceModeIntegration];" not in s:
              if create_marker not in s:
                  raise SystemExit("Could not find SceneDelegate settings creation point")
              s = s.replace(create_marker, create_replacement, 1)

          scene.write_text(s, encoding="utf-8")

          assert "+ (void)installSurfaceModeIntegration;" in header.read_text(encoding="utf-8")
          assert "+ (void)installSurfaceModeIntegration" in impl.read_text(encoding="utf-8")
          assert "[AppSettingsController installSurfaceModeIntegration];" in scene.read_text(encoding="utf-8")
          print("SurfaceMode settings integration forced successfully")
          PY

      - name: Patch upstream iOS resource packaging
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("freerdp-upstream/client/iOS/CMakeLists.txt")
          text = path.read_text(encoding="utf-8")
          marker = "add_dependencies(${PROJECT_NAME} freerdp)"
          addition = "target_sources(${PROJECT_NAME} PRIVATE ${RESOURCES})\n\n"

          if addition.strip() not in text:
              if marker not in text:
                  raise SystemExit("Could not find iFreeRDP resource-patch insertion point")
              text = text.replace(marker, addition + marker, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Configure unsigned device build
        run: |
          cmake -S freerdp-upstream/client/iOS \
            -B freerdp-upstream/build/ios-device \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/freerdp-upstream/cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_LD_RUNPATH_SEARCH_PATHS="@executable_path/Frameworks" \
            -G Xcode

      - name: Build unsigned app for physical iOS device
        run: |
          XCODEPROJ="$(find freerdp-upstream/build/ios-device -name 'iFreeRDP.xcodeproj' -print -quit)"
          if [ -z "$XCODEPROJ" ]; then
            echo "Failed to locate the generated Xcode project"
            exit 1
          fi

          xcodebuild -project "$XCODEPROJ" \
            -scheme iFreeRDP \
            -configuration Release \
            -destination "generic/platform=iOS" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            LD_RUNPATH_SEARCH_PATHS='$(inherited) @executable_path/Frameworks'

      - name: Assemble and validate unsigned app
        run: |
          set -euo pipefail

          APP_PATH="$(find freerdp-upstream/build/ios-device -type d -path '*/Release-iphoneos/iFreeRDP.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Failed to locate the final Release-iphoneos/iFreeRDP.app bundle"
            echo "All iFreeRDP.app candidates were:"
            find freerdp-upstream/build/ios-device -type d -name 'iFreeRDP.app' -print || true
            exit 1
          fi

          echo "Using final device app: $APP_PATH"

          # CMake's generic MACOSX_BUNDLE Info.plist does not emit the
          # UIApplicationSceneManifest that FreeRDP 3.30's SceneDelegate
          # requires. Without it, AppDelegate launches but never creates a
          # UIWindow, leaving the physical iPad on a black screen.
          PLIST="$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :UIApplicationSceneManifest" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UIApplicationSupportsMultipleScenes bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UISceneConfigurations dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneConfigurationName string 'Default Configuration'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName string SceneDelegate" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneClassName string UIWindowScene" "$PLIST"

          echo "===== Scene manifest ====="
          /usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest" "$PLIST"

          DEPS_DIR="$GITHUB_WORKSPACE/freerdp-upstream/build/ios-device/deps"
          FRAMEWORKS_DIR="$APP_PATH/Frameworks"
          mkdir -p "$FRAMEWORKS_DIR"

          # Copy loose dylibs without flattening anything that belongs to a
          # framework bundle. Frameworks are copied separately below.
          DYLIB_COUNT=0
          while IFS= read -r dylib; do
            [ -n "$dylib" ] || continue
            cp -L "$dylib" "$FRAMEWORKS_DIR/$(basename "$dylib")"
            DYLIB_COUNT=$((DYLIB_COUNT + 1))
          done < <(
            find "$DEPS_DIR" \
              -type d -name '*.framework' -prune -o \
              \( \( -type f -o -type l \) -a -name '*.dylib' \) -print |
              sort -u
          )

          if [ "$DYLIB_COUNT" -eq 0 ]; then
            echo "No device dylibs were found under $DEPS_DIR"
            exit 1
          fi
          echo "Embedded $DYLIB_COUNT dylib files/aliases"

          # Some FreeRDP dependencies (for example libpng) are emitted as
          # iOS framework bundles. Preserve the full Foo.framework/Foo
          # layout instead of flattening them into Frameworks/Foo.
          FRAMEWORK_COUNT=0
          while IFS= read -r framework; do
            [ -n "$framework" ] || continue
            destination="$FRAMEWORKS_DIR/$(basename "$framework")"
            rm -rf "$destination"
            ditto "$framework" "$destination"
            FRAMEWORK_COUNT=$((FRAMEWORK_COUNT + 1))
          done < <(
            find "$DEPS_DIR" -type d -name '*.framework' -prune -print |
              sort -u
          )
          echo "Embedded $FRAMEWORK_COUNT framework bundles"

          canonical_path() {
            python3 - "$1" <<'PY'
          import os
          import sys
          print(os.path.realpath(sys.argv[1]))
          PY
          }

          relative_path() {
            python3 - "$1" "$2" <<'PY'
          import os
          import sys
          print(os.path.relpath(sys.argv[1], sys.argv[2]))
          PY
          }

          resolve_embedded_dependency() {
            local macho="$1"
            local dep="$2"
            local rel=""
            local candidate=""

            case "$dep" in
              @rpath/*)
                rel="${dep#@rpath/}"
                candidate="$FRAMEWORKS_DIR/$rel"
                ;;
              @executable_path/*)
                rel="${dep#@executable_path/}"
                candidate="$APP_PATH/$rel"
                if [ -e "$candidate" ]; then
                  printf '%s\n' "$candidate"
                  return 0
                fi
                ;;
              @loader_path/*)
                rel="${dep#@loader_path/}"
                candidate="$(dirname "$macho")/$rel"
                if [ -e "$candidate" ]; then
                  printf '%s\n' "$candidate"
                  return 0
                fi
                ;;
              */Frameworks/*)
                # Absolute build-machine paths such as
                # /Users/runner/.../deps/Frameworks/libcrypto.4.dylib
                # become the matching object inside the app Frameworks dir.
                rel="${dep##*/Frameworks/}"
                candidate="$FRAMEWORKS_DIR/$rel"
                ;;
              *)
                rel="$(basename "$dep")"
                candidate="$FRAMEWORKS_DIR/$rel"
                ;;
            esac

            if [ -e "$candidate" ]; then
              printf '%s\n' "$candidate"
              return 0
            fi

            # Last-resort fallback for a loose dylib whose original install
            # name had a different parent directory.
            candidate="$FRAMEWORKS_DIR/$(basename "$dep")"
            if [ -e "$candidate" ]; then
              printf '%s\n' "$candidate"
              return 0
            fi

            return 1
          }

          normalize_macho() {
            local macho="$1"
            local dep target replacement target_rel loader_rel
            local macho_real target_real current_id new_id id_rel

            chmod u+w "$macho"
            macho_real="$(canonical_path "$macho")"

            while IFS= read -r dep; do
              [ -n "$dep" ] || continue

              case "$dep" in
                /System/Library/*|/usr/lib/*)
                  continue
                  ;;
              esac

              if ! target="$(resolve_embedded_dependency "$macho" "$dep")"; then
                echo "Cannot bundle dependency required by $macho: $dep"
                echo "Searched the embedded Frameworks bundle, including framework paths."
                return 1
              fi

              target_real="$(canonical_path "$target")"

              # otool -L includes a dylib/framework's own install name.
              # Do not rewrite that as a dependency; its ID is normalized
              # separately below.
              if [ "$target_real" = "$macho_real" ]; then
                continue
              fi

              if [ "$macho" = "$APP_PATH/iFreeRDP" ]; then
                target_rel="$(relative_path "$target" "$FRAMEWORKS_DIR")"
                replacement="@executable_path/Frameworks/$target_rel"
              else
                loader_rel="$(relative_path "$target" "$(dirname "$macho")")"
                replacement="@loader_path/$loader_rel"
              fi

              if [ "$dep" != "$replacement" ]; then
                echo "Rewriting dependency in $macho:"
                echo "  $dep"
                echo "  -> $replacement"
                install_name_tool -change "$dep" "$replacement" "$macho"
              fi
            done < <(otool -L "$macho" | tail -n +2 | awk '{print $1}')

            # If this Mach-O is a dylib (including a framework binary),
            # give it a portable ID that preserves its path under Frameworks.
            current_id="$(otool -D "$macho" 2>/dev/null | tail -n +2 | head -n 1 || true)"
            if [ -n "$current_id" ] && [[ "$macho" == "$FRAMEWORKS_DIR/"* ]]; then
              id_rel="$(relative_path "$macho" "$FRAMEWORKS_DIR")"
              new_id="@rpath/$id_rel"
              if [ "$current_id" != "$new_id" ]; then
                echo "Setting Mach-O id for $macho:"
                echo "  $current_id"
                echo "  -> $new_id"
                install_name_tool -id "$new_id" "$macho"
              fi
            fi
          }

          normalize_macho "$APP_PATH/iFreeRDP"

          # Normalize every Mach-O object under Frameworks, including
          # framework executables whose names do not end in .dylib.
          while IFS= read -r macho; do
            if file "$macho" | grep -q 'Mach-O'; then
              normalize_macho "$macho"
            fi
          done < <(find "$FRAMEWORKS_DIR" -type f -print | sort)

          echo "===== Normalized Mach-O dependencies ====="
          otool -L "$APP_PATH/iFreeRDP"
          while IFS= read -r macho; do
            if file "$macho" | grep -q 'Mach-O'; then
              otool -L "$macho"
            fi
          done < <(find "$FRAMEWORKS_DIR" -type f -print | sort)

          rm -rf "$APP_PATH/_CodeSignature"
          rm -f "$APP_PATH/embedded.mobileprovision"

          validate_app() {
            local app="$1"
            local executable="$app/iFreeRDP"
            local plist="$app/Info.plist"

            echo "===== Validating $app ====="
            find "$app" -type f -print | sort

            if [ ! -f "$executable" ]; then
              echo "Missing iFreeRDP executable"
              return 1
            fi
            if [ ! -f "$plist" ]; then
              echo "Missing Info.plist"
              return 1
            fi

            file "$executable"
            if ! lipo -info "$executable" | grep -q 'arm64'; then
              echo "iFreeRDP executable is not arm64"
              return 1
            fi

            BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
            if [ "$BUNDLE_ID" != "com.freerdp.ifreerdp" ]; then
              echo "Unexpected bundle identifier: $BUNDLE_ID"
              return 1
            fi

            PLATFORM="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$plist")"
            if [ "$PLATFORM" != "iPhoneOS" ]; then
              echo "Expected iPhoneOS bundle, got: $PLATFORM"
              return 1
            fi

            SCENE_DELEGATE="$(/usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName' "$plist" 2>/dev/null || true)"
            if [ "$SCENE_DELEGATE" != "SceneDelegate" ]; then
              echo "Missing/incorrect iOS scene delegate configuration: $SCENE_DELEGATE"
              return 1
            fi
            echo "Scene delegate configured: $SCENE_DELEGATE"

            STRINGS_FILE="$(mktemp)"
            strings "$executable" > "$STRINGS_FILE"
            if ! grep -Fq "Surface Mode Control" "$STRINGS_FILE"; then
              echo "Surface Mode UI strings are missing from executable"
              rm -f "$STRINGS_FILE"
              return 1
            fi
            if ! grep -Fq "Send PING" "$STRINGS_FILE"; then
              echo "Surface Mode PING UI is missing from executable"
              rm -f "$STRINGS_FILE"
              return 1
            fi
            rm -f "$STRINGS_FILE"
            echo "Surface Mode UI strings found in executable"

            for resource in MainWindow BookmarkListView RDPSessionView CredentialsInputView; do
              if ! find "$app" \( -name "${resource}.nib" -o -name "${resource}.xib" \) -print -quit | grep -q .; then
                echo "Missing required UI resource: $resource"
                return 1
              fi
            done

            PNG_COUNT="$(find "$app" -type f -iname '*.png' | wc -l | tr -d '[:space:]')"
            if [ "$PNG_COUNT" -lt 10 ]; then
              echo "Expected bundled PNG resources, found only $PNG_COUNT"
              return 1
            fi
            echo "Found $PNG_COUNT PNG resources"

            if ! otool -l "$executable" | grep -A3 LC_RPATH | grep -q '@executable_path/Frameworks'; then
              echo "Missing @executable_path/Frameworks runtime search path"
              return 1
            fi

            local macho dep rel resolved
            while IFS= read -r macho; do
              if ! file "$macho" | grep -q 'Mach-O'; then
                continue
              fi

              if ! lipo -info "$macho" | grep -q 'arm64'; then
                echo "Non-arm64 Mach-O in app: $macho"
                return 1
              fi

              echo "Dependencies for $macho:"
              otool -L "$macho"

              while IFS= read -r dep; do
                [ -n "$dep" ] || continue
                case "$dep" in
                  /System/Library/*|/usr/lib/*)
                    ;;
                  @rpath/*)
                    rel="${dep#@rpath/}"
                    if [ -e "$app/Frameworks/$rel" ]; then
                      resolved="$app/Frameworks/$rel"
                    elif [ -e "$app/$rel" ]; then
                      resolved="$app/$rel"
                    else
                      echo "Missing @rpath dependency required by $macho: $dep"
                      return 1
                    fi
                    echo "Resolved $dep -> $resolved"
                    ;;
                  @executable_path/*)
                    rel="${dep#@executable_path/}"
                    if [ ! -e "$app/$rel" ]; then
                      echo "Missing @executable_path dependency required by $macho: $dep"
                      return 1
                    fi
                    ;;
                  @loader_path/*)
                    rel="${dep#@loader_path/}"
                    if [ ! -e "$(dirname "$macho")/$rel" ]; then
                      echo "Missing @loader_path dependency required by $macho: $dep"
                      return 1
                    fi
                    ;;
                  /*)
                    echo "Unexpected non-system absolute dependency required by $macho: $dep"
                    return 1
                    ;;
                esac
              done < <(otool -L "$macho" | tail -n +2 | awk '{print $1}')
            done < <(find "$app" -type f -print | sort)
          }

          validate_app "$APP_PATH"

          IPA_ROOT="$RUNNER_TEMP/unsigned-ipa"
          IPA_PATH="$RUNNER_TEMP/AzureSurface-iPad-unsigned.ipa"
          rm -rf "$IPA_ROOT" "$RUNNER_TEMP/ipa-check"
          rm -f "$IPA_PATH"
          mkdir -p "$IPA_ROOT/Payload"
          ditto "$APP_PATH" "$IPA_ROOT/Payload/iFreeRDP.app"

          (
            cd "$IPA_ROOT"
            /usr/bin/zip -qry "$IPA_PATH" Payload
          )

          if [ ! -f "$IPA_PATH" ]; then
            echo "Failed to create unsigned IPA"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q "$IPA_PATH" -d "$RUNNER_TEMP/ipa-check"
          validate_app "$RUNNER_TEMP/ipa-check/Payload/iFreeRDP.app"

          echo "ARTIFACT=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzureSurface-iPad-unsigned.ipa
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error
