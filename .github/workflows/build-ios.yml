name: build-ios

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew update
          brew install cmake ninja pkg-config nasm python3

      - name: Clone FreeRDP
        run: git clone --depth 1 --branch 3.30.0 https://github.com/FreeRDP/FreeRDP.git freerdp-upstream

      - name: Apply SurfaceMode overlay
        run: bash ios/scripts/apply-freerdp-overlay.sh "$GITHUB_WORKSPACE/freerdp-upstream"

      - name: Configure simulator build
        run: |
          cmake -S freerdp-upstream/client/iOS \
            -B freerdp-upstream/build/ios-sim \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/freerdp-upstream/cmake/ios.toolchain.cmake" \
            -DPLATFORM=SIMULATORARM64 \
            -DDEPLOYMENT_TARGET=15.0 \
            -G Xcode

      - name: Build simulator app
        run: cmake --build freerdp-upstream/build/ios-sim --config Release

      - name: Package app
        run: |
          APP_PATH="$(find freerdp-upstream/build/ios-sim -type d -name 'iFreeRDP.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "Failed to locate the built iFreeRDP.app bundle"
            exit 1
          fi
          ZIP_PATH="$RUNNER_TEMP/AzureSurface-iPad-simulator.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          echo "ARTIFACT=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzureSurface-iPad-simulator.zip
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error
